---
layout: null
---
<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMPIREON</title>
  <style>
    html { color-scheme: dark; background: #111a22; color: #f4ead4; font: 1rem system-ui, sans-serif; }
    body { max-width: 36rem; margin: 18vh auto; padding: 1.5rem; }
    a { color: #e6bf77; }
  </style>
</head>
<body>
  <main>
    <h1 lang="en">EMPIREON</h1>
    <p id="status" role="status">פותח את הגרסה האחרונה…</p>
    <a id="play" hidden>פתיחת המשחק</a>
    <noscript>כדי לפתוח את המשחק יש להפעיל JavaScript בדפדפן.</noscript>
  </main>

  <!-- GitHub Pages fills this list from the files in the same deployment. -->
  <template id="releases">
    {% for file in site.static_files %}
      {% if file.extname == '.html' %}<span data-path="{{ file.path | escape }}"></span>{% endif %}
    {% endfor %}
    {% for page_file in site.pages %}
      <span data-path="{{ page_file.url | escape }}"></span>
    {% endfor %}
  </template>
  <script>
    (() => {
      const published = new URL("https://ohad-rab2.github.io/emp/game.html");
      const status = document.getElementById("status");
      const link = document.getElementById("play");

      function openGame(target) {
        target.search = location.search;
        target.hash = location.hash;
        link.href = target.href;
        link.hidden = false;
        location.replace(target.href);
      }

      // Opening a downloaded source file should launch the published game.
      if (location.protocol === "file:" || "{{ 'published' }}" !== "published") {
        if (location.origin === published.origin && location.pathname === published.pathname) {
          status.textContent = "דף המשחק טרם עובד על ידי GitHub Pages. נסה לרענן בעוד רגע.";
          return;
        }
        openGame(published);
        return;
      }

      const names = document.getElementById("releases").content.querySelectorAll("[data-path]");
      const pattern = /^(?:EMPIREON|CIVI)_v(\d+(?:[._-]\d+)*)(?:[ ._-][^/]+)?\.html$/i;
      const releases = [];
      for (const node of names) {
        const name = node.dataset.path.replace(/^\//, "");
        const match = pattern.exec(name);
        if (match) releases.push({name, version: match[1].split(/[._-]/).map(Number)});
      }
      releases.sort((left, right) => {
        const length = Math.max(left.version.length, right.version.length);
        for (let i = 0; i < length; i++) {
          const difference = (right.version[i] || 0) - (left.version[i] || 0);
          if (difference) return difference;
        }
        // At the same version prefer EMPIREON over its former name, CIVI.
        return right.name.localeCompare(left.name, "en");
      });

      if (releases.length) {
        openGame(new URL(encodeURIComponent(releases[0].name), location.href));
      } else {
        status.textContent = "טרם פורסמה גרסת משחק בתיקייה הזאת.";
      }
    })();
  </script>
</body>
</html>
